name: Build & push Docker image

# Triggers :
#   - push sur main         -> tags ":latest" + ":<sha-court>"  (utilise par staging)
#   - tag git "v*"          -> tag ":vX.Y.Z"                    (pin pour prod)
#   - declenchement manuel  -> via l'onglet Actions de GitHub
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Evite 2 builds simultanes sur le meme ref (le 2e annule le 1er en cours)
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/davidkdevui/actidec-app

jobs:
  # Build + push de l'image Docker.
  # La validation (typecheck + lint) est faite DANS le Dockerfile (stage builder)
  # avant `npm run build` -> un seul `npm ci`, pas de duplication host/Docker.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # upload des resultats Trivy dans l'onglet Security
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcule les tags a appliquer selon le trigger :
      #   - push sur main : :latest + :sha-court
      #   - tag v1.2.3    : :v1.2.3 + :1.2.3 + :1.2 + :1
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan de vulnerabilites sur l'image qu'on vient de pousser.
      # On scan par digest (immutable) plutot que par tag.
      # exit-code=0 -> le scan ne fait pas echouer le build : les findings
      # sont remontes dans l'onglet Security via SARIF.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
