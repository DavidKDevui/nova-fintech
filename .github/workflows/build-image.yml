name: Build & push Docker image

# Triggers :
#   - push sur main         -> tags ":latest" + ":<sha-court>"  (utilise par staging)
#   - tag git "v*"          -> tag ":vX.Y.Z"                    (pin pour prod)
#   - declenchement manuel  -> via l'onglet Actions de GitHub
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Evite 2 builds simultanes sur le meme ref (le 2e annule le 1er en cours)
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/davidkdevui/actidec-app

jobs:
  # ── Job 1 : validation rapide (typecheck + lint) ──
  # Si ca foire, on saute le build (qui prend 5x plus de temps).
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

  # ── Job 2 : build + push de l'image Docker ──
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcule les tags a appliquer selon le trigger :
      #   - push sur main : :latest + :sha-court
      #   - tag v1.2.3    : :v1.2.3 + :1.2.3 + :1.2 + :1
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
