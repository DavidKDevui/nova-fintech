name: Build & push Docker image

# Triggers :
#   - push sur main         -> tags ":latest" + ":<sha-court>"  (utilise par staging)
#   - tag git "v*"          -> tag ":vX.Y.Z"                    (pin pour prod)
#   - declenchement manuel  -> via l'onglet Actions de GitHub
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Evite 2 builds simultanes sur le meme ref (le 2e annule le 1er en cours)
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + push des images Docker (matrice) :
  #   - actidec-app     <- contexte frontend/  (l'app Next.js)
  #   - actidec-landing <- contexte landing/   (la landing page)
  # La validation (typecheck + lint) est faite DANS chaque Dockerfile (stage builder)
  # avant `npm run build` -> un seul `npm ci`, pas de duplication host/Docker.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/davidkdevui/actidec-app
            context: frontend
          - image: ghcr.io/davidkdevui/actidec-landing
            context: landing
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcule les tags a appliquer selon le trigger :
      #   - push sur main : :latest + :sha-court
      #   - tag v1.2.3    : :v1.2.3 + :1.2.3 + :1.2 + :1
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache GHA cloisonne par image pour eviter que les 2 builds se marchent dessus
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
