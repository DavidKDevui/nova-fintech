services:
  db:
    image: postgres:16-alpine
    container_name: nova-fintech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: change_me_in_prod
      POSTGRES_DB: nova_fintech
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova_fintech"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: your-dockerhub-user/nova-fintech-frontend:latest
    container_name: nova-fintech-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nova:change_me_in_prod@db:5432/nova_fintech
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"

volumes:
  db_data:
