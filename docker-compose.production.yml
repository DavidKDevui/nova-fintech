services:
  db:
    image: postgres:16-alpine
    container_name: actidec-database-production
    restart: unless-stopped
    networks:
      - actidec-network-production
    environment:
      POSTGRES_USER: TXOVUIGCRP9JZOINLFS8WSY4V9L62XCK
      POSTGRES_PASSWORD: XtP0KJeopI69vc7wlQzKBidJ2Eed2snS
      POSTGRES_DB: actidec_production
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data_production:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U TXOVUIGCRP9JZOINLFS8WSY4V9L62XCK -d actidec_production"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: your-dockerhub-user/nova-fintech-frontend:production
    container_name: actidec-app-production
    restart: unless-stopped
    networks:
      - actidec-network-production
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://TXOVUIGCRP9JZOINLFS8WSY4V9L62XCK:XtP0KJeopI69vc7wlQzKBidJ2Eed2snS@actidec-database-production:5432/actidec_production
      NEXT_PUBLIC_APP_URL: https://app.actidec.example.com
      NODE_ENV: production
    env_file:
      - ./frontend/.env.production
    ports:
      - "3000:3000"

networks:
  actidec-network-production:
    name: actidec-network-production
    driver: bridge

volumes:
  db_data_production:
