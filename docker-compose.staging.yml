services:
  db:
    image: postgres:16-alpine
    container_name: actidec-database-staging
    restart: unless-stopped
    shm_size: 256mb
    networks:
      - actidec-network-staging
    environment:
      TZ: Europe/Paris
      PGTZ: Europe/Paris
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: actidec_staging
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data_staging:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d actidec_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  app:
    image: ghcr.io/davidkdevui/actidec-app:${IMAGE_TAG}
    container_name: actidec-app-staging
    restart: unless-stopped
    networks:
      - actidec-network-staging
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@actidec-database-staging:5432/actidec_staging
      NEXT_PUBLIC_APP_URL: https://staging.supadmin.dev
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Bridge (sandbox)
      BRIDGE_CLIENT_ID: ${BRIDGE_CLIENT_ID}
      BRIDGE_CLIENT_SECRET: ${BRIDGE_CLIENT_SECRET}
      BRIDGE_API_URL: https://api.bridgeapi.io/v3
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # External APIs
      FHIR_API_KEY: ${FHIR_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    env_file:
      - ./.env.staging
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"
    labels:
      ofelia.enabled: "true"

      # Sync bancaire — toutes les heures, à la minute 0
      ofelia.job-exec.sync-bank.schedule: "0 0 * * * *"
      ofelia.job-exec.sync-bank.command: "pnpm cron:sync-bank"
      ofelia.job-exec.sync-bank.no-overlap: "true"

      # Check alertes tréso — toutes les 15 minutes
      ofelia.job-exec.check-alerts.schedule: "0 */15 * * * *"
      ofelia.job-exec.check-alerts.command: "pnpm cron:check-alerts"
      ofelia.job-exec.check-alerts.no-overlap: "true"

      # Rappels échéances — chaque jour à 8h
      ofelia.job-exec.deadlines-reminder.schedule: "0 0 8 * * *"
      ofelia.job-exec.deadlines-reminder.command: "pnpm cron:deadlines-reminder"

      # Check alertes taux de rejet — chaque jour à 8h30 (cooldown 14 jours côté job)
      ofelia.job-exec.check-rejection-alerts.schedule: "0 30 8 * * *"
      ofelia.job-exec.check-rejection-alerts.command: "pnpm cron:check-rejection-alerts"
      ofelia.job-exec.check-rejection-alerts.no-overlap: "true"

      # Récap mensuel — le 1er du mois à 9h
      ofelia.job-exec.monthly-recap.schedule: "0 0 9 1 * *"
      ofelia.job-exec.monthly-recap.command: "pnpm cron:monthly-recap"

  # Landing page (marketing) — Next.js standalone, sans DB ni cron.
  # Exposee sur le port hote 3002 ; nginx proxie le domaine vitrine vers ce container.
  landing:
    image: ghcr.io/davidkdevui/actidec-landing:${IMAGE_TAG}
    container_name: actidec-landing-staging
    restart: unless-stopped
    networks:
      - actidec-network-staging
    environment:
      TZ: Europe/Paris
      NODE_ENV: production
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: actidec-ofelia-staging
    restart: unless-stopped
    networks:
      - actidec-network-staging
    environment:
      TZ: Europe/Paris
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

networks:
  actidec-network-staging:
    name: actidec-network-staging
    driver: bridge

volumes:
  db_data_staging:
